<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="45%" stop-color="#b91c1c"/>
      <stop offset="55%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background decorative circular glow -->
  <circle cx="60" cy="58" r="54" fill="#ffffff" stroke="#eab308" stroke-width="2"/>
  
  <!-- Mount Kenya Peaks -->
  <polygon points="35,46 48,28 58,46" fill="#0284c7" opacity="0.8"/>
  <polygon points="52,46 64,22 76,46" fill="#0369a1"/>
  <polygon points="70,46 80,32 88,46" fill="#0ea5e9" opacity="0.8"/>
  <polygon points="61,22 64,22 66,28 61,28" fill="#ffffff"/> <!-- Snow peak -->
  <polygon points="46,28 48,28 50,34 46,34" fill="#ffffff"/>

  <!-- Rising Sun behind mountains -->
  <circle cx="60" cy="24" r="10" fill="url(#sunGrad)"/>
  <!-- Sun rays -->
  <g stroke="#eab308" stroke-width="1.8" stroke-linecap="round">
    <line x1="60" y1="10" x2="60" y2="5"/>
    <line x1="49" y1="14" x2="45" y2="10"/>
    <line x1="71" y1="14" x2="75" y2="10"/>
    <line x1="42" y1="22" x2="36" y2="21"/>
    <line x1="78" y1="22" x2="84" y2="21"/>
  </g>

  <!-- Main Shield -->
  <path d="M 40,44 L 80,44 Q 82,68 60,86 Q 38,68 40,44 Z" fill="url(#shieldGrad)" stroke="#eab308" stroke-width="2.5" filter="url(#shadow)"/>
  
  <!-- Shield Chevron / Dividing lines -->
  <path d="M 40,44 L 60,66 L 80,44" fill="none" stroke="#facc15" stroke-width="2"/>
  <line x1="60" y1="66" x2="60" y2="85" stroke="#facc15" stroke-width="2"/>

  <!-- Open Book Symbol (Wisdom / Sapientia) -->
  <g transform="translate(60, 56) scale(0.7)">
    <path d="M -16,-6 Q -8,-10 0,-6 Q 8,-10 16,-6 L 16,8 Q 8,4 0,8 Q -8,4 -16,8 Z" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
    <line x1="0" y1="-5" x2="0" y2="8" stroke="#1e293b" stroke-width="1.2"/>
    <!-- Page text lines -->
    <line x1="-12" y1="-2" x2="-4" y2="-3" stroke="#94a3b8" stroke-width="1"/>
    <line x1="-12" y1="2" x2="-4" y2="1" stroke="#94a3b8" stroke-width="1"/>
    <line x1="4" y1="-3" x2="12" y2="-2" stroke="#94a3b8" stroke-width="1"/>
    <line x1="4" y1="1" x2="12" y2="2" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Left Supporter: Golden Lion -->
  <g transform="translate(23, 44) scale(0.65)">
    <path d="M 14,35 C 10,28 6,18 10,10 C 12,6 16,4 18,7 C 20,4 24,5 24,9 C 25,12 22,17 21,22 C 24,24 25,28 24,35 C 22,37 20,44 24,50 L 17,50 C 14,44 14,38 14,35 Z" fill="url(#goldGrad)"/>
    <circle cx="16" cy="8" r="1.5" fill="#78350f"/>
    <!-- Lion paw resting on shield -->
    <ellipse cx="23" cy="22" rx="3" ry="2" fill="#ca8a04"/>
  </g>

  <!-- Right Supporter: Golden Lion -->
  <g transform="translate(97, 44) scale(-0.65, 0.65)">
    <path d="M 14,35 C 10,28 6,18 10,10 C 12,6 16,4 18,7 C 20,4 24,5 24,9 C 25,12 22,17 21,22 C 24,24 25,28 24,35 C 22,37 20,44 24,50 L 17,50 C 14,44 14,38 14,35 Z" fill="url(#goldGrad)"/>
    <circle cx="16" cy="8" r="1.5" fill="#78350f"/>
    <ellipse cx="23" cy="22" rx="3" ry="2" fill="#ca8a04"/>
  </g>

  <!-- Bottom Ribbon / Scroll -->
  <g filter="url(#shadow)">
    <!-- Ribbon ends -->
    <path d="M 16,92 L 26,86 L 26,98 Z" fill="#15803d"/>
    <path d="M 104,92 L 94,86 L 94,98 Z" fill="#15803d"/>
    <!-- Main Banner Ribbon -->
    <path d="M 22,94 Q 60,86 98,94 L 95,102 Q 60,94 25,102 Z" fill="#166534" stroke="#eab308" stroke-width="1.5"/>
    <path d="M 24,95 Q 60,88 96,95" stroke="#fef08a" stroke-width="0.8" fill="none"/>
    <!-- Text on Ribbon -->
    <text x="60" y="99" font-family="system-ui, sans-serif" font-size="5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">SAPscript / TOGETHER WE GROW</text>
  </g>
</svg>
